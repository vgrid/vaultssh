name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: cargo test --locked --bin vssh

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: ${{ matrix.target }}
      - name: Match tag to package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          test "$RELEASE_TAG" = "v$version"
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ runner.os }}" == Windows ]]; then
            cp "target/${{ matrix.target }}/release/vssh.exe" dist/
            (cd dist && 7z a -tzip "${{ matrix.target }}.zip" vssh.exe)
            rm dist/vssh.exe
          else
            tar -czf "dist/${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" vssh
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: release
          merge-multiple: true
      - name: Verify assets and generate checksums
        run: |
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 5
          cd release
          sha256sum ./*.tar.gz ./*.zip > checksum.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
